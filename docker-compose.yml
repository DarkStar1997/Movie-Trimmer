# Production stack: scanner (detector + pipeline) + VLM arbiter sidecar.
#
# The arbiter is a llama-server container (Qwen3-VL-30B-A3B MoE GGUF,
# OpenAI-compatible API) — the scanner reaches it via ARBITER_BASE_URL and
# never loads a VLM in-process (design doc §10: 0.054s/frame at 4 slots,
# 10 contested-GT flips vs 2 for the transformers 8B). Both share the GPU;
# ~22.5GB of 24GB total.
#
#   docker compose up -d          # scanner on :8081, sidecar on the internal
#                                 # network only
services:
  vlm:
    image: ghcr.io/darkstar1997/movie-trimmer-vlm-qwen3vl-30b-a3b:v1
    # -ub 2048 uncaps the image-token budget (512 -> 1120) so dim/distant
    # figures get full-resolution vision tokens
    environment:
      EXTRA_ARGS: "-ub 2048"
    shm_size: 2g
    gpus: all
    restart: unless-stopped

  scanner:
    image: ghcr.io/darkstar1997/movie-trimmer-scanner:v1
    ports:
      - "8081:8081"
    volumes:
      - ./trt_cache:/cache/trt
      - ./:/movies:ro
      - ./blur_outputs:/blur_outputs
    environment:
      ARBITER_BASE_URL: http://vlm:8082
      ARBITER_HTTP_CONCURRENCY: "4"
      BLUR_OUTPUT_DIR: /blur_outputs
    gpus: all
    depends_on:
      vlm:
        condition: service_healthy
    restart: unless-stopped
