# All-in-one: the whole pipeline — scan -> VLM arbiter (llama-server on
# loopback) -> crowd -> GPU blur render — in ONE container.
#
#   docker compose up -d     # API on :8081, arbiter inside on 127.0.0.1
#
# llama-server claims ~20.5GB VRAM at model load; the entrypoint
# health-gates it before the API starts (the ordering the old
# two-container stack had via depends_on: service_healthy). One GPU,
# ~22.5GB of 24GB in use.
services:
  movie-trimmer:
    build:
      # compose silently skips services with no build: section — the pair
      # layout once shipped a "fix" that wasn't in the container this way
      context: .
      dockerfile: allinone.Dockerfile
    image: ghcr.io/darkstar1997/movie-trimmer:v1
    init: true
    ports:
      - "8081:8081"
    volumes:
      - ./trt_cache:/cache/trt
      - ./:/movies:ro
      - ./blur_outputs:/blur_outputs
    environment:
      ARBITER_HTTP_CONCURRENCY: "4"
      BLUR_OUTPUT_DIR: /blur_outputs
    gpus: all
    restart: unless-stopped
